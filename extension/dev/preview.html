<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Preview</title>
<style>
  /* A neutral stand-in for a listing page. Nothing here is copied from a real listing. */
  html, body { margin: 0; background: #f3f4f5; }
  body { font: 16px/1.5 Georgia, "Times New Roman", serif; color: #333; }
  .nav { height: 64px; background: #fff; border-bottom: 1px solid #e2e4e7; display: flex; align-items: center; gap: 24px; padding: 0 40px; }
  .logo { width: 120px; height: 24px; background: #d5d8dc; border-radius: 4px; }
  .navlink { width: 64px; height: 12px; background: #e3e5e8; border-radius: 3px; }
  main { max-width: 1120px; margin: 24px 0 0 40px; }
  .hero { height: 380px; background: #dfe2e6; border-radius: 6px; }
  h1 { font-size: 28px; margin: 20px 0 8px; color: #2b2d30; }
  .line { height: 12px; background: #e1e3e6; border-radius: 3px; margin: 10px 0; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 24px; }
  .card { height: 140px; background: #e6e8eb; border-radius: 6px; }
  .note { position: fixed; left: 40px; bottom: 12px; font: 12px/1.4 ui-monospace, Menlo, monospace; color: #7a7f86; }
</style>
</head>
<body>
  <div class="nav"><div class="logo"></div><div class="navlink"></div><div class="navlink"></div><div class="navlink"></div></div>
  <main>
    <div class="hero"></div>
    <h1>1 Example Street, Surry Hills NSW 2010</h1>
    <div class="line" style="width: 46%"></div>
    <div class="line" style="width: 62%"></div>
    <div class="line" style="width: 38%"></div>
    <div class="grid"><div class="card"></div><div class="card"></div><div class="card"></div></div>
  </main>
  <div class="note" id="note"></div>

  <script src="../src/panel.js"></script>
  <script src="fixtures.js"></script>
  <script>
    (function () {
      var F = window.MBX_FIXTURES;
      var panel = null;
      var lastAddress = F.listing;

      function show(name) {
        var collapse = name === 'collapsed';
        var key = collapse ? 'ok' : name;
        var state = F.states[key] || F.states.ok;
        if (state.address) lastAddress = state.address;
        panel = MBX.createPanel({
          shadowMode: 'open', // dev preview: tools/preview-shots.mjs reads the shadow root
          onSubmitAddress: function (text) {
            console.log('[preview] onSubmitAddress', text);
            lastAddress = text;
            panel.setState({ kind: 'loading', address: text, source: 'typed' });
          },
          onRetry: function () {
            console.log('[preview] onRetry');
            panel.setState({ kind: 'loading', address: lastAddress, source: 'h1' });
          },
          onClose: function () {
            console.log('[preview] onClose');
            panel.destroy();
          }
        });
        panel.setState(state);
        if (collapse) {
          var btn = document.getElementById('mbx-root').shadowRoot.querySelector('button[aria-label="Collapse Listing Check"]');
          btn.click();
          btn.ownerDocument.activeElement && btn.ownerDocument.activeElement.blur();
        }
        document.getElementById('note').textContent = 'preview #' + (name || 'ok');
      }

      function fromHash() { show((location.hash || '#ok').slice(1)); }
      window.addEventListener('hashchange', fromHash);
      fromHash();
    })();
  </script>
</body>
</html>
