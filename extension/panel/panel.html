<!-- Result template loaded into the extension shadow root. -->
<template id="mbx-result-template">
  <div class="mbx-body" data-mbx-body lang="en-AU">
    <section class="mbx-addr" aria-label="Matched home">
      <p class="mbx-label">Matched home</p>
      <h2 class="mbx-addr__name" data-bind="display_name" translate="no"></h2>
      <p class="mbx-addr__listing" data-bind="listing_line"></p>
      <p class="mbx-addr__check" data-bind="check"></p>
      <button type="button" class="mbx-linkbtn" data-action="not-this-one" aria-expanded="false" aria-controls="mbx-picker">Not this one?</button>
      <div class="mbx-picker" id="mbx-picker" data-slot="picker" hidden>
        <p class="mbx-picker__hint" id="mbx-picker-hint">Other matches in the City of Sydney</p>
        <ul class="mbx-picker__list" data-slot="picker-list" aria-labelledby="mbx-picker-hint"></ul>
        <form class="mbx-typeit" data-slot="typeit" role="search" aria-label="Look up a different address" novalidate>
          <label class="mbx-typeit__label" for="mbx-typeit-input">Or type the address</label>
          <div class="mbx-typeit__row">
            <input id="mbx-typeit-input" class="mbx-typeit__input" name="address" type="text" autocomplete="off" spellcheck="false" enterkeyhint="search" placeholder="e.g. 26 Tudor Street, Surry Hills NSW 2010">
            <button type="submit" class="mbx-btn">Look up</button>
          </div>
        </form>
      </div>
    </section>
    <p class="mbx-confirm-match" data-slot="confirm-match" hidden>Confirm the address to see this home’s fit.</p>
    <section class="mbx-score" aria-label="Fit score">
      <h3 class="mbx-label">Your fit score</h3>
      <div class="mbx-meter-slot" data-slot="meter"></div>
    </section>
    <section class="mbx-insights-slot" data-slot="insights" aria-label="Pros, cons and fit pillars"></section>
    <section class="mbx-profile-slot" data-slot="profile" aria-label="Your profile"></section>
    <footer class="mbx-foot">
      <p class="mbx-foot__small">Indicative estimates · Microburbs · Open G-NAF © Geoscape</p>
    </footer>
  </div>
</template>
